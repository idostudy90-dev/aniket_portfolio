<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Other Stuffs — Aniket</title>
  <meta name="description" content="Posters, branding, illustrations and sketches by Aniket.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@1&family=IBM+Plex+Sans:wght@400;500;600&family=Parkinsans:wght@400&family=Passero+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="fonts/aniket-font.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Same one line as index.html, and for the same reason: it has to run
       before the page draws, or the footer flashes on at full strength and
       then hides itself to fade back in. See notes.md. -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="case-page case-page--gallery">

  <!-- ══════════════════════════════════════════════════
       NAV — a back arrow and the project's name.

       It is the home page's bar, reused: same classes, so it
       lines up with it exactly. `id="nav"` is what app.js looks
       for, and `data-hide-on-scroll` is what makes it slide away
       as you read down and come back when you scroll up. The
       home page leaves that attribute off and stays stuck.

       ⚠️ The arrow goes back to the OTHER STUFFS SECTION, not the
       top of the home page — the same rule the project pages
       follow, so you land back on the post-it you clicked.
       ══════════════════════════════════════════════════ -->
  <header class="nav case-nav" id="nav" data-hide-on-scroll>
    <div class="nav__wrap">
      <div class="nav__inner">
        <div class="nav__content">
          <div class="nav__row">
            <a class="case-nav__back" href="index.html#stuffs" aria-label="Back to other stuffs">
              <img src="assests/nav_arrow.png" alt="" aria-hidden="true" width="48" height="48" decoding="async">
            </a>
          </div>
          <img class="nav__rule" src="assests/nav-rule.svg" alt="" aria-hidden="true">
        </div>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════
       OTHER STUFFS — the gallery

       Not a case study: one picture, the mosaic of Aniket's
       posters, branding, illustrations and sketches. It reuses
       the case pages' `.case` layout wholesale — same bar, same
       heading sizes, same end arrow, same footer — because it is
       the same kind of page and there is no reason for it to
       drift away from them.
       ══════════════════════════════════════════════════ -->
  <main class="case">

    <!-- ⚠️ ONE ROW, NOT TWO STACKED LINES. Aniket marked the name at
         the LEFT edge of the content frame and the description at the
         RIGHT (2026-09-11), so these are flex items in `.case__head`
         now rather than two centred blocks. They stack again on phones,
         where a row this wide cannot work. -->
    <div class="case__head">
      <h1 class="case__name">Other Stuffs</h1>

      <!-- The post-it's own words on the home page. If one changes,
           change the other. -->
      <p class="case__title">posters, branding, illustrations and sketches</p>
    </div>

    <!-- ── The mosaic ──
         ⚠️ TWO GENUINELY DIFFERENT PICTURES, not one image rescaled.
         The desktop mosaic is 1440 x 1542 and lays the work out wide;
         the phone one is 390 x 1291 and re-stacks the same pieces
         into a narrow column. Neither is a crop of the other.

         `<picture>` is what makes that free: the browser fetches ONLY
         the one whose `media` matches, so a phone never downloads the
         4.4 MB desktop file — it gets the 1 MB one and nothing else.
         The breakpoint is 1023, the same line the whole site changes
         layout on.

         No `loading="lazy"`: this picture IS the page, and it is on
         screen the moment you arrive. Lazy-loading it would only
         delay the one thing you came for.

         ⚠️ `.case__shots` caps at 90rem and runs the picture edge to
         edge inside that — which is exactly how the mosaic is drawn,
         with tiles bleeding to all four sides. Don't inset it. -->
    <div class="case__shots case__shots--full">
      <picture>
        <source media="(max-width: 1023px)" srcset="assests/other%20stuffs-phone.png">
        <img src="assests/other%20stuffs-dekstop.png" width="1440" height="1542"
             alt="A mosaic of Aniket's posters, branding, illustrations and sketches">
      </picture>
    </div>


    <a class="case__back" href="index.html#stuffs" aria-label="Back to other stuffs">
      <img class="case__arrow" src="assests/nav_arrow.png" alt="" aria-hidden="true" width="48" height="48" loading="lazy" decoding="async">
    </a>

  </main>

  <!-- ══════════════════════════════════════════════════
       THE FOOTER WEDGE

       ⚠️ THIS REPLACED THE ENTIRE CONNECT BAND — Aniket asked for the
       footer out and this triangle in its place (2026-09-10). What went
       with it: the cropped laptop, the "lets connect" heading, the three
       link chips (email / LinkedIn / Behance) and the pen mark at the
       bottom edge. THE SITE NOW CARRIES NO CONTACT LINKS ANYWHERE. That
       is the change he asked for, not something overlooked — if they
       come back, they come back somewhere else.

       ⚠️ `id="connect"` IS KEPT ON PURPOSE. Nothing links to it today,
       but it is still the page's bottom anchor and costs nothing.

       ⚠️ `%20`, NOT A RAW SPACE, and the file really is spelled
       "triagle" — that is the asset's own name on disk. Renaming it means
       renaming it in all ten pages.
       ══════════════════════════════════════════════════ -->
  <footer class="footer" id="connect">
    <img class="footer__wedge" src="assests/footer%20triagle.png" alt="" aria-hidden="true"
         data-reveal loading="lazy" decoding="async" width="4172" height="1182">

    <!-- ⚠️ THE TEXT LIES OVER THE PICTURE, and it is placed against the
         PICTURE, not against the page. Aniket marked two spots on the
         wedge (2026-09-10): the heading about a third of the way down and
         the chip row under it, both near the middle. Each is anchored as a
         PERCENTAGE of the wedge's height in styles.css, so the pair keeps
         its place on the shape at any window width.

         ⚠️ BOTH SIT ON THE WHITE HALF. At this x the blue does not start
         until ~88% down, so the drawn colours — grey heading, brand
         labels — still read. Push either much lower or much further right
         and it crosses the diagonal onto blue, where they will not. -->
    <p class="footer__title" data-reveal><span class="footer__lets">lets</span> connect</p>

    <!-- ⚠️ REAL TEXT, NOT THREE PNGs. Each chip is a glyph, a <span> and
         an out-arrow, so the link says its own name and the label colours
         are one line of CSS each. -->
    <ul class="footer__links" data-reveal>
      <li>
        <a class="footer__link footer__link--email" href="mailto:aniket.sharma@iitg.ac.in">
          <img class="footer__glyph footer__glyph--mail" src="assests/icon-mail.svg" alt="" loading="lazy" decoding="async" width="30" height="30">
          <span class="footer__label">Email</span>
          <img class="footer__out" src="assests/icon-out.svg" alt="" aria-hidden="true" loading="lazy" decoding="async" width="24" height="24">
        </a>
      </li>
      <li>
        <a class="footer__link footer__link--linkedin" href="https://www.linkedin.com/in/aniket-kumar-sharma-7b370a381/" target="_blank" rel="noopener noreferrer">
          <!-- ⚠️ WRAPPED, because the Figma overscans this one by ~1% to
               keep the logo's own edge off the box. The other two do not. -->
          <span class="footer__glyph footer__glyph--linkedin">
            <img src="assests/icon-linkedin.jpg" alt="" loading="lazy" decoding="async" width="499" height="499">
          </span>
          <span class="footer__label">Linkedin</span>
          <img class="footer__out" src="assests/icon-out.svg" alt="" aria-hidden="true" loading="lazy" decoding="async" width="24" height="24">
        </a>
      </li>
      <li>
        <a class="footer__link footer__link--behance" href="https://www.behance.net/aniket-sharma" target="_blank" rel="noopener noreferrer">
          <img class="footer__glyph footer__glyph--behance" src="assests/icon-behance.png" alt="" loading="lazy" decoding="async" width="640" height="640">
          <span class="footer__label">Behance</span>
          <img class="footer__out" src="assests/icon-out.svg" alt="" aria-hidden="true" loading="lazy" decoding="async" width="24" height="24">
        </a>
      </li>
    </ul>
  </footer>

  <script src="app.js"></script>
</body>
</html>
