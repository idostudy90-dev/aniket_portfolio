  <!-- ══════════════════════════════════════════════════
       THE FOOTER WEDGE — the same one as the home page.
       ⚠️ It is a COPY. If index.html's footer changes, change it here
       too, or the next regenerate quietly undoes it.

       ⚠️ THIS REPLACED THE WHOLE CONNECT BAND — Aniket asked for the
       footer out and this triangle in its place (2026-09-10). The
       laptop, "lets connect", the three link chips and the pen mark all
       went with it, so THE SITE CARRIES NO CONTACT LINKS ANY MORE. That
       is the change, not an oversight.

       ⚠️ `%20`, NOT A RAW SPACE, and the file really is spelled
       "triagle" — that is the asset's own name on disk.
       ══════════════════════════════════════════════════ -->
  <footer class="footer" id="connect">
    <img class="footer__wedge" src="assests/footer%20triagle.png" alt="" aria-hidden="true"
         data-reveal loading="lazy" decoding="async" width="4172" height="1182">

    <!-- ⚠️ THE TEXT LIES OVER THE PICTURE, and it is placed against the
         PICTURE, not against the page. Aniket marked two spots on the
         wedge (2026-09-10): the heading about a third of the way down and
         the chip row under it, both near the middle. Each is anchored as a
         PERCENTAGE of the wedge's height in styles.css, so the pair keeps
         its place on the shape at any window width.

         ⚠️ BOTH SIT ON THE WHITE HALF. At this x the blue does not start
         until ~88% down, so the drawn colours — grey heading, brand
         labels — still read. Push either much lower or much further right
         and it crosses the diagonal onto blue, where they will not. -->
    <p class="footer__title" data-reveal><span class="footer__lets">lets</span> connect</p>
