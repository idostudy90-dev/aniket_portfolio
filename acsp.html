<body class="case-page">

  <!-- ══════════════════════════════════════════════════
       NAV — a back arrow and the project's name.

       It is the home page's bar, reused: same classes, so it
       lines up with it exactly. `id="nav"` is what app.js looks
       for, and `data-hide-on-scroll` is what makes it slide away
       as you read down and come back when you scroll up. The
       home page leaves that attribute off and stays stuck.

       ⚠️ The arrow goes to the PROJECTS SECTION, not the top of
       the home page — Aniket's ask, so you land back where you
       left off.
       ══════════════════════════════════════════════════ -->
  <header class="nav case-nav" id="nav" data-hide-on-scroll>
    <div class="nav__wrap">
      <div class="nav__inner">
        <div class="nav__content">
          <div class="nav__row">
            <a class="case-nav__back" href="index.html#projects" aria-label="Back to projects">
              <span aria-hidden="true">&#8592;</span>
            </a>
            <p class="case-nav__title">acsp</p>
          </div>
          <img class="nav__rule" src="assests/nav-rule.svg" alt="" aria-hidden="true">
        </div>
      </div>
    </div>
  </header>

       ══════════════════════════════════════════════════ -->

    <a class="case__back" href="index.html#projects" aria-label="Back to projects">
