<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asterix — Aniket</title>
  <meta name="description" content="Asterix — a proactive customer support system for identification and solving customer issues.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@1&family=IBM+Plex+Sans:wght@400;500;600&family=Parkinsans:wght@400&family=Passero+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="fonts/aniket-font.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Same one line as index.html, and for the same reason: it has to run
       before the page draws, or the footer flashes on at full strength and
       then hides itself to fade back in. See notes.md. -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="case-page">

  <!-- ══════════════════════════════════════════════════
       NAV — a back arrow and the project's name.

       It is the home page's bar, reused: same classes, so it
       lines up with it exactly. `id="nav"` is what app.js looks
       for, and `data-hide-on-scroll` is what makes it slide away
       as you read down and come back when you scroll up. The
       home page leaves that attribute off and stays stuck.

       ⚠️ The arrow goes to the PROJECTS SECTION, not the top of
       the home page — Aniket's ask, so you land back where you
       left off.
       ══════════════════════════════════════════════════ -->
  <header class="nav case-nav" id="nav" data-hide-on-scroll>
    <div class="nav__wrap">
      <div class="nav__inner">
        <div class="nav__content">
          <div class="nav__row">
            <a class="case-nav__back" href="index.html#projects" aria-label="Back to projects">
              <span aria-hidden="true">&#8592;</span>
            </a>
            <p class="case-nav__title">Asterix</p>
          </div>
          <img class="nav__rule" src="assests/nav-rule.svg" alt="" aria-hidden="true">
        </div>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════
       ASTERIX — the case study
       ══════════════════════════════════════════════════ -->
  <main class="case">

    <h1 class="case__name">Asterix</h1>

    <!-- The project's own description, exactly as it reads on the card
         in the projects section. If one changes, change the other. -->
    <p class="case__title">a proactive customer support system for identification and solving customer issues</p>

    <!-- ── The write-up ──
         10 slices of one continuous image, stacked in order so they read
         as a single long picture. `.case__shots` kills the gaps between
         them; see styles.css.

         The first one loads straight away because it is on screen; the
         rest are lazy, because together they are 8.1 MB. -->
    <div class="case__shots">
      <img src="assests/asterix/1.png" width="1440" height="6611" alt="Asterix case study, part 1 of 10">
      <img src="assests/asterix/2.png" width="1440" height="8101" alt="Asterix case study, part 2 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/3.png" width="1440" height="9310" alt="Asterix case study, part 3 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/4.png" width="1440" height="9098" alt="Asterix case study, part 4 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/5.png" width="1440" height="7688" alt="Asterix case study, part 5 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/6.png" width="1440" height="9864" alt="Asterix case study, part 6 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/7.png" width="1440" height="4603" alt="Asterix case study, part 7 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/8.png" width="1440" height="4055" alt="Asterix case study, part 8 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/9.png" width="1440" height="6154" alt="Asterix case study, part 9 of 10" loading="lazy" decoding="async">
      <img src="assests/asterix/10.png" width="1440" height="5500" alt="Asterix case study, part 10 of 10" loading="lazy" decoding="async">
    </div>


    <a class="case__back" href="index.html#projects" aria-label="Back to projects">
      <span class="case__arrow" aria-hidden="true">&#8592;</span>
    </a>

  </main>
